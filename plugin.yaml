name: hermes-crawl4ai
version: 1.0.0
description: "Crawl4AI web_extract provider for Hermes."
author: SolerSoft
kind: backend
provides_web_providers:
  - crawl4ai
requires_env:
  - name: CRAWL4AI_URL
    description: "Base URL of your Crawl4AI instance"
    url: http://crawl4ai:11235
  - name: CRAWL4AI_API_TOKEN
    description: "Bearer token created for your Crawl4AI instance"
    secret: true
